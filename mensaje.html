<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Mensaje - PI Pisos & Inmuebles</title>
</head>
<body>

    <header>
        <h1>PI - Pisos & Inmuebles</h1>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Página principal</a>
                </li>
                <li>
                    <a href="registro.html">Registro</a>
                </li>
                <li>
                    <a href="buscar.html">Buscar</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contactar con el anunciante</h2>
            
            <form action="#" method="post">
                <p>
                    <label for="tipo_mensaje">Tipo de mensaje:</label>
                    <select id="tipo_mensaje" name="tipo_mensaje" required>
                        <option value="">Selecciona el motivo...</option>
                        <option value="cita">Solicitar una cita</option>
                        <option value="informacion">Más información</option>
                        <option value="oferta">Comunicar una oferta</option>
                    </select>
                </p>

                <p>
                    <label for="texto">Texto del mensaje:</label><br>
                    <textarea id="texto" name="texto" rows="6" cols="50" required placeholder="Escribe tu mensaje aquí..."></textarea>
                </p>

                <p>
                    <button type="submit">Enviar mensaje</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <hr>

        <nav>
            <a href="index.html">Página principal</a>
            <a href="registro.html">Registro</a>
            <a href="buscar.html">Buscar</a>
        </nav>

        <p>
            <small>
                Autores: Juana Valentina Echeveste y Alex Punzano Gil<br>
                &copy; 2026 PI - Pisos & Inmuebles. El portal de tu vivienda.
            </small>
        </p>
    </footer>
</body>
</html>
