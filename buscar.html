<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Búsqueda Rápida</title>
</head>
<body>
    <header>
        <h1>PI - Pisos & Inmuebles</h1>

        <!-- Menú de navegación -->
         <nav>
            <ul>
                <li><a href="index.html">Página principal</a></li>
                <li><a href="registro.html">Registro</a></li>
            </ul>
         </nav>
    </header>
    
    <h2>Formulario de Búsqueda</h2>

    <form action="resultados.html" method="get">
            <br><label for = "tipo_anuncio">Tipo de Anuncio:</label>
            <input type="radio" id="venta" name="tipo_anuncio" value="venta">
            <label for="venta">Venta</label>
            <input type="radio" id="alquiler" name="tipo_anuncio" value="alquiler">
            <label for="alquiler">Alquiler</label>
    
            <br><label for = "tipo_vivienda">Tipo de Vivienda:</label>
            <select id="tipo_vivienda" name="tipo_vivienda">
                <option value="">Selecciona un tipo de vivienda...</option>
                <option value="obra_nueva">Obra Nueva</option>
                <option value="vivienda">Vivienda</option>
                <option value="oficina">Oficina</option>
                <option value="local">Local</option>
                <option value="garaje">Garaje</option>
            </select>

            <br><label for = "ciudad">Ciudad:</label>
            <input type="text" id = "ciudad" name = "ciudad">

            <br><label for="pais">País:</label>
            <select id="pais" name="pais">
                <option value="">Cualquier país...</option>
                <option value="espana">España</option>
                <option value="mexico">México</option>
                <option value="argentina">Argentina</option>
            </select>

            <br><label for="precio">Precio Máximo (€):</label>
            <input type="number" id="precio" name="precio" min="0">

            <br><label for="fecha_publicacion">Fecha de publicación (desde):</label>
            <input type="date" id="fecha_publicacion" name="fecha_publicacion">

            <br><br>
            <button type="submit">Buscar Anuncios</button>
    </form>


</body>
</html>
