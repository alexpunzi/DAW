<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

    <title>Registro | PI - Pisos &amp; Inmuebles</title>
</head>

<body>

    <a href="#contenido" class="enlace-saltar">Saltar al contenido principal</a>

    <header>
        <h1>PI - Pisos &amp; Inmuebles</h1>

        <nav>
            <ul>
                <li>
                    <a href="buscar.html">
                        <span class="material-symbols-outlined" aria-hidden="true">search</span>
                        Buscar
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main id="contenido">

        <h2>Registro de Usuario</h2>

        <p><small>* Campos obligatorios</small></p>

        <form action="index_sesion.html" method="post" enctype="multipart/form-data">

            <p>
                <label for="nombre">
                    <span class="material-symbols-outlined" aria-hidden="true">person</span>
                    Nombre *
                </label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    minlength="3"
                    maxlength="15"
                    pattern="[A-Za-z][A-Za-z0-9]{2,14}"
                    required
                >
            </p>

            <p>
                <label for="email">
                    <span class="material-symbols-outlined" aria-hidden="true">mail</span>
                    Email *
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="254"
                    pattern="[A-Za-z0-9!#$%&'*+\/=?^_`\{\|\}~\-]+(\.[A-Za-z0-9!#$%&'*+\/=?^_`\{\|\}~\-]+)*@[A-Za-z0-9\-]+(\.[A-Za-z0-9\-]+)+"
                    title="Formato: parte-local@dominio (sin puntos consecutivos ni al principio/final)."
                    required
                >
            </p>

            <p>
                <label for="password">
                    <span class="material-symbols-outlined" aria-hidden="true">lock</span>
                    Contraseña *
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="6"
                    maxlength="15"
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])[A-Za-z0-9\-_]+"
                    title="Debe contener mayúscula, minúscula, número y guiones."
                    required
                >
            </p>

            <p>
                <label for="confirmar_password">
                    <span class="material-symbols-outlined" aria-hidden="true">lock</span>
                    Repetir Contraseña *
                </label>
                <input
                    type="password"
                    id="confirmar_password"
                    name="confirmar_password"
                    minlength="6"
                    maxlength="15"
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])[A-Za-z0-9\-_]+"
                    required
                >
            </p>

            <p>
                <label for="sexo">
                    <span class="material-symbols-outlined" aria-hidden="true">wc</span>
                    Sexo *
                </label>
                <select id="sexo" name="sexo" required>
                    <option value="">Selecciona una opción...</option>
                    <option value="mujer">Mujer</option>
                    <option value="hombre">Hombre</option>
                </select>
            </p>

            <p>
                <label for="fecha_nacimiento">
                    <span class="material-symbols-outlined" aria-hidden="true">calendar_month</span>
                    Fecha nacimiento *
                </label>
                <input
                    type="date"
                    id="fecha_nacimiento"
                    name="fecha_nacimiento"
                    max="2008-09-23"
                    required
                >
            </p>

            <p>
                <label for="ciudad">
                    <span class="material-symbols-outlined" aria-hidden="true">location_city</span>
                    Ciudad de residencia
                </label>
                <input
                    type="text"
                    id="ciudad"
                    name="ciudad"
                >
            </p>

            <p>
                <label for="pais">
                    <span class="material-symbols-outlined" aria-hidden="true">public</span>
                    País de residencia
                </label>
                <select id="pais" name="pais">
                    <option value="">Selecciona un país...</option>
                    <option value="argentina">Argentina</option>
                    <option value="espana">España</option>
                    <option value="mexico">México</option>
                </select>
            </p>

            <p>
                <label for="foto">
                    <span class="material-symbols-outlined" aria-hidden="true">photo_camera</span>
                    Foto de Perfil
                </label>
                <input
                    type="file"
                    id="foto"
                    name="foto"
                    accept="image/*"
                >
            </p>

            <button type="submit">
                <span class="material-symbols-outlined" aria-hidden="true">person_add</span>
                Registrarse
            </button>

        </form>

    </main>

    <footer>

        <hr>

        <nav>
            <a href="buscar.html">
                <span class="material-symbols-outlined" aria-hidden="true">search</span>
                Buscar
            </a>
        </nav>

        <p>
            <small>
                Autores: Juana Valentina Echeveste y Alex Punzano Gil<br>
                &copy; 2026 PI - Pisos &amp; Inmuebles. El portal de tu vivienda.
            </small>
        </p>

    </footer>

</body>

</html>
