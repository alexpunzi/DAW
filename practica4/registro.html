<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/common.css">
    <title>Página de Registro</title>
</head>

<body>
    <a href="#contenido" class="enlace-saltar">Saltar al contenido principal</a>

    <header>
        <h1>PI - Pisos &amp; Inmuebles</h1>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Página principal</a>
                </li>
                <li>
                    <a href="buscar.html">Buscar</a>
                </li>
            </ul>
        </nav>
    </header>

    <main id="contenido">

        <h2>Registro de Usuario</h2>

        <form action="index_sesion.html" method="post" enctype="multipart/form-data">

            <p><small>* Campos obligatorios</small></p>

            <label for="nombre">Nombre *</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                minlength="3"
                maxlength="15"
                pattern="[A-Za-z][A-Za-z0-9]{2,14}"
                required
            >

            <label for="email">Email *</label>
            <input
                type="email"
                id="email"
                name="email"
                maxlength="254"
                pattern="[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+(\.[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+"
                title="Formato: parte-local@dominio (sin puntos consecutivos ni al principio/final)."
                required
            >

            <label for="password">Contraseña *</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="6"
                maxlength="15"
                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])[A-Za-z0-9\-_]+"
                title="Debe contener mayúscula, minúscula, número y guiones."
                required
            >

            <label for="confirmar_password">Repetir Contraseña *</label>
            <input
                type="password"
                id="confirmar_password"
                name="confirmar_password"
                minlength="6"
                maxlength="15"
                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])[A-Za-z0-9\-_]+"
                required
            >

            <label for="sexo">Sexo *</label>
            <select id="sexo" name="sexo" required>
                <option value="">Selecciona una opción...</option>
                <option value="mujer">Mujer</option>
                <option value="hombre">Hombre</option>
            </select>

            <label for="fecha_nacimiento">Fecha nacimiento *</label>
            <input
                type="date"
                id="fecha_nacimiento"
                name="fecha_nacimiento"
                max="2008-09-23"
                required
            >

            <label for="ciudad">Ciudad de residencia</label>
            <input
                type="text"
                id="ciudad"
                name="ciudad"
            >

            <label for="pais">País de residencia</label>
            <select id="pais" name="pais">
                <option value="">Selecciona un país...</option>
                <option value="argentina">Argentina</option>
                <option value="espana">España</option>
                <option value="mexico">México</option>
            </select>

            <label for="foto">Foto de Perfil</label>
            <input
                type="file"
                id="foto"
                name="foto"
                accept="image/*"
            >

            <button type="submit">Registrarse</button>

        </form>

    </main>

    <footer>

        <hr>

        <nav>
            <a href="index.html">Página principal</a>
            <a href="buscar.html">Buscar</a>
        </nav>

        <p>
            <small>
                Autores: Juana Valentina Echeveste y Alex Punzano Gil<br>
                &copy; 2026 PI - Pisos &amp; Inmuebles. El portal de tu vivienda.
            </small>
        </p>

    </footer>
</body>

</html>
